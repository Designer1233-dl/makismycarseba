<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сайт‑Севы — общайся по‑своему</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#101b2d;--muted:#7d899c;--line:#e8edf4;--primary:#4f72ea;--primary-2:#708af2;--soft:#edf1ff;--green:#42c48c;--shadow:0 18px 50px rgba(26,45,85,.09)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}button,input{font:inherit}button{border:0;cursor:pointer}
    .app{height:100vh;display:grid;grid-template-columns:82px 330px 1fr;max-width:1500px;margin:auto;background:var(--panel);box-shadow:var(--shadow)}
    .rail{background:#f7f9fc;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:22px 0;gap:22px}.brand{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#6c86f4,#3b5fd7);color:white;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 8px 18px #6e85ed55}.rail .nav{display:flex;flex-direction:column;gap:12px;margin-top:26px}.rail button{width:46px;height:46px;border-radius:15px;background:transparent;color:#94a0b3;font-size:20px;transition:.2s}.rail button.active,.rail button:hover{background:var(--soft);color:var(--primary)}.rail .bottom{margin-top:auto}
    .sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.side-head{padding:28px 24px 18px;display:flex;align-items:center;justify-content:space-between}.side-head h1{font-size:22px;margin:0;letter-spacing:-.5px}.new-chat{width:38px;height:38px;border-radius:12px;background:var(--primary);color:white;font-size:22px;box-shadow:0 6px 14px #4f72ea44}.search{padding:0 20px 16px;position:relative}.search input{width:100%;border:0;background:#f5f7fb;border-radius:12px;padding:12px 14px 12px 40px;outline:0;color:var(--ink);font-size:13px}.search span{position:absolute;left:34px;top:11px;color:#97a2b4}.tabs{display:flex;gap:4px;padding:0 20px 15px;border-bottom:1px solid var(--line)}.tabs button{background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:8px 10px;border-radius:9px}.tabs button.active{color:var(--primary);background:var(--soft)}.chat-list{overflow:auto}.chat{padding:13px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:3px solid transparent}.chat:hover,.chat.selected{background:#fafbff}.chat.selected{border-left-color:var(--primary)}.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:750;flex:none;position:relative}.avatar:after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;background:var(--green);border-radius:50%;border:2px solid white}.av-purple{background:linear-gradient(135deg,#b48af7,#765ee4)}.av-orange{background:linear-gradient(135deg,#ffc576,#ef8d4b)}.av-pink{background:linear-gradient(135deg,#f38dba,#d95482)}.av-blue{background:linear-gradient(135deg,#73c5ee,#4c83e6)}.av-cyan{background:linear-gradient(135deg,#52d9d1,#329bba)}.chat-body{min-width:0;flex:1}.chat-row{display:flex;justify-content:space-between;gap:8px}.chat-name{font-size:13px;font-weight:750}.time{font-size:10px;color:#abb4c1}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.badge{background:var(--primary);color:#fff;font-size:10px;border-radius:10px;padding:2px 6px}
    .main{display:flex;flex-direction:column;min-width:0;background:#fff}.topbar{height:83px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:14px}.topbar .avatar{width:42px;height:42px}.top-info{flex:1}.top-info strong{font-size:15px}.top-info small{display:block;color:var(--green);font-size:11px;margin-top:4px}.top-actions{display:flex;gap:8px}.icon-btn{width:38px;height:38px;border-radius:11px;background:#f5f7fb;color:#8491a6;font-size:16px}.icon-btn:hover{background:var(--soft);color:var(--primary)}.messages{padding:26px 9%;overflow:auto;flex:1;background:linear-gradient(180deg,#fff 0%,#fbfcff 100%)}.day{text-align:center;color:#a6afbd;font-size:11px;font-weight:650;margin:8px 0 22px}.msg{display:flex;gap:10px;margin:16px 0;align-items:flex-end}.msg.me{justify-content:flex-end}.msg .avatar{width:28px;height:28px;border-radius:10px;font-size:10px}.msg .avatar:after{display:none}.bubble{max-width:min(530px,72%);padding:12px 15px;border-radius:17px 17px 17px 5px;background:#f2f5fa;color:#29344a;font-size:13px;line-height:1.45}.msg.me .bubble{background:var(--primary);color:#fff;border-radius:17px 17px 5px 17px}.meta{font-size:10px;opacity:.6;margin-top:5px;text-align:right}.photo-card{width:255px;padding:5px;background:#eef2ff;border-radius:17px 17px 5px 17px}.photo-card img{width:100%;height:154px;object-fit:cover;border-radius:13px;display:block}.photo-card .meta{padding:2px 6px;color:var(--primary)}.voice{display:flex;align-items:center;gap:10px;min-width:225px}.play{width:31px;height:31px;border-radius:50%;background:#fff;color:var(--primary);font-size:13px}.wave{height:27px;display:flex;align-items:center;gap:3px;flex:1}.wave i{display:block;width:3px;background:currentColor;border-radius:2px;opacity:.65}.wave i:nth-child(odd){height:10px}.wave i:nth-child(3n){height:22px}.wave i:nth-child(4n){height:15px}.composer{border-top:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:10px}.composer input{flex:1;border:0;outline:0;background:#f6f8fb;padding:13px 16px;border-radius:14px;font-size:13px}.send{width:43px;height:43px;border-radius:13px;background:var(--primary);color:#fff;font-size:17px;box-shadow:0 7px 15px #4f72ea44}.attach{font-size:20px;color:#9aa6b9;background:transparent;padding:8px}.empty{display:none;position:absolute;inset:0;background:#fff;place-items:center;text-align:center}.empty h2{margin:0 0 8px}.empty p{color:var(--muted);font-size:13px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(19,31,58,.38);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:5}.modal{width:min(390px,calc(100vw - 32px));background:#fff;border-radius:24px;padding:30px;box-shadow:0 28px 80px rgba(18,31,68,.22)}.modal .brand{margin-bottom:20px}.modal h2{font-size:23px;letter-spacing:-.5px;margin:0 0 8px}.modal p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 20px}.modal input{width:100%;border:1px solid var(--line);padding:13px 14px;border-radius:12px;outline:0;margin-bottom:12px}.modal button.primary{width:100%;padding:13px;border-radius:12px;color:#fff;background:var(--primary);font-weight:700}.modal .hint{font-size:11px;color:#a3adbc;text-align:center;margin-top:13px}
    @media(max-width:900px){.app{grid-template-columns:66px 285px 1fr}.messages{padding:24px 5%}}@media(max-width:650px){body{overflow:auto}.app{min-height:100vh;height:auto;grid-template-columns:1fr}.rail{display:none}.sidebar{height:100vh}.main{display:none}.sidebar.mobile-hidden{display:none}.mobile-main{display:flex}.topbar{padding:0 16px}.messages{padding:20px 16px}.composer{padding:12px}.back{display:block!important}.top-actions .hide-sm{display:none}}
    .back{display:none;background:transparent;font-size:20px;color:var(--muted)}
    .empty-state{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty-state .empty-icon{font-size:42px;margin-bottom:10px}.empty-state h2{color:var(--ink);margin:0 0 7px;font-size:20px}.empty-state p{font-size:13px;margin:0 0 18px}.empty-state button{background:var(--primary);color:white;border-radius:11px;padding:11px 16px;font-weight:700}.profile-modal{position:fixed;inset:0;background:#13203a66;display:grid;place-items:center;z-index:10}.profile-card{background:#fff;border-radius:22px;padding:26px;width:min(370px,calc(100vw - 30px))}.profile-card h2{margin:0 0 18px}.profile-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px}.profile-card .avatar-edit{width:72px;height:72px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;background:var(--soft);color:var(--primary);font-size:28px;overflow:hidden;cursor:pointer}.profile-card .avatar-edit img{width:100%;height:100%;object-fit:cover}.profile-card .save{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:10px;font-weight:700}.profile-card .close{float:right;background:none;color:var(--muted);font-size:20px}
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail"><div class="brand">С</div><div class="nav"><button class="active" title="Чаты">◈</button><button id="friendsBtn" title="Друзья">♧</button><button title="Звонки">◡</button></div><div class="bottom"><button id="settingsBtn" title="Настройки">⚙</button></div></aside>
    <aside class="sidebar" id="sidebar"><div class="side-head"><h1>Сообщения</h1><button class="new-chat" id="newChat">+</button></div><div class="search"><span>⌕</span><input id="search" placeholder="Поиск друзей и чатов" /></div><div class="tabs"><button class="active">Все</button><button>Непрочитанные</button><button>Группы</button></div><div class="chat-list" id="chatList"></div></aside>
    <main class="main" id="main"><header class="topbar"><button class="back" id="back">‹</button><div class="avatar av-purple" id="headAvatar">А</div><div class="top-info"><strong id="headName">Алина Морозова</strong><small id="headStatus">в сети</small></div><div class="top-actions"><button class="icon-btn">⌕</button><button class="icon-btn hide-sm">☎</button><button class="icon-btn">⋯</button></div></header><section class="messages" id="messages"></section><form class="composer" id="composer"><button type="button" class="attach" id="photoBtn" title="Прикрепить фото">＋</button><input id="input" autocomplete="off" placeholder="Написать сообщение..." /><button type="button" class="attach" id="voiceBtn" title="Голосовое сообщение">◉</button><button class="send" title="Отправить">➤</button><input type="file" id="fileInput" accept="image/*" hidden /></form></main>
  </div>
  <div class="modal-backdrop" id="welcome"><div class="modal"><div class="brand">С</div><h2>Войти в Сайт‑Севы</h2><p>Нажми одну кнопку — откроется Telegram‑бот <b>@seva_Sot_Set_bot</b>. Нажми «Start» и вернись на сайт.</p><button class="primary" id="createAccount">Войти через Telegram</button><div class="hint" id="codeHint">Персональная защищённая ссылка действует 5 минут</div></div></div>
  <script>
    const chats=[{id:1,name:'Алина Морозова',initial:'А',av:'av-purple',status:'в сети',preview:'А ты уже видела новые фото?',time:'12:45',unread:2,messages:[['in','Привет! ✨ Как твой день?', '12:41'],['me','Привет! Отлично, наконец закончила проект. А ты?', '12:42'],['in','Супер! Я как раз хотела показать тебе кое-что 👀','12:43'],['in','А ты уже видела новые фото?','12:45']]},{id:2,name:'Максим Орлов',initial:'М',av:'av-orange',status:'был в сети 5 мин назад',preview:'Голосовое сообщение',time:'11:18',messages:[['in','Отправил тебе голосовое, послушай когда будет минутка 🎙️','11:18','voice']]},{id:3,name:'Лера Ким',initial:'Л',av:'av-pink',status:'в сети',preview:'Отправлено фото',time:'Вчера',messages:[['me','Лови фото с прогулки 🌿','Вчера','photo']]},{id:4,name:'Команда проекта',initial:'К',av:'av-blue',status:'5 участников',preview:'Дима: Давайте завтра в 10',time:'Вт',messages:[['in','Дима: Давайте завтра в 10 обсудим план','Вт']]},{id:5,name:'Илья Смирнов',initial:'И',av:'av-cyan',status:'был в сети вчера',preview:'Хорошо, договорились!',time:'Пн',messages:[['me','Хорошо, договорились!','Пн']]}];
    let active=chats[0]; const list=document.getElementById('chatList');
    function renderList(filter=''){list.innerHTML=chats.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())).map(c=>`<div class="chat ${c.id===active.id?'selected':''}" data-id="${c.id}"><div class="avatar ${c.av}">${c.initial}</div><div class="chat-body"><div class="chat-row"><span class="chat-name">${c.name}</span><span class="time">${c.time}</span></div><div class="chat-row"><span class="preview">${c.preview}</span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div></div></div>`).join('');document.querySelectorAll('.chat').forEach(el=>el.onclick=()=>selectChat(+el.dataset.id));}
    function selectChat(id){active=chats.find(c=>c.id===id);document.getElementById('headName').textContent=active.name;document.getElementById('headStatus').textContent=active.status;const av=document.getElementById('headAvatar');av.className='avatar '+active.av;av.textContent=active.initial;renderMessages();renderList(document.getElementById('search').value);if(innerWidth<=650){document.getElementById('sidebar').classList.add('mobile-hidden');document.getElementById('main').classList.add('mobile-main')}}
    function renderMessages(){const box=document.getElementById('messages');box.innerHTML='<div class="day">Сегодня</div>'+active.messages.map(m=>{if(m[3]==='photo')return `<div class="msg me"><div class="photo-card"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=500&q=80"><div class="meta">${m[1]} · ${m[2]} ✓✓</div></div></div>`;if(m[3]==='voice')return `<div class="msg"><div class="avatar ${active.av}">${active.initial}</div><div class="bubble voice"><button class="play">▶</button><div class="wave">${Array.from({length:22},(_,i)=>`<i style="height:${8+(i*7)%20}px"></i>`).join('')}</div><span class="meta">0:18</span></div></div>`;return `<div class="msg ${m[0]==='me'?'me':''}">${m[0]==='in'?`<div class="avatar ${active.av}">${active.initial}</div>`:''}<div class="bubble">${m[1]}<div class="meta">${m[2]}${m[0]==='me'?' ✓✓':''}</div></div></div>`}).join('');box.scrollTop=box.scrollHeight;}
    document.getElementById('composer').onsubmit=e=>{e.preventDefault();const input=document.getElementById('input');if(!input.value.trim())return;active.messages.push(['me',input.value.trim(),'сейчас']);active.preview=input.value.trim();active.time='сейчас';input.value='';renderMessages();renderList(document.getElementById('search').value)};
    document.getElementById('search').oninput=e=>renderList(e.target.value);document.getElementById('newChat').onclick=()=>alert('Найди друга через поиск и нажми на его имя — добавление в друзья уже рядом ✨');document.getElementById('friendsBtn').onclick=()=>alert('Раздел «Друзья»: здесь появятся все твои контакты. Пригласи первого друга по ссылке!');document.getElementById('voiceBtn').onclick=()=>{active.messages.push(['me','Голосовое сообщение','сейчас','voice']);active.preview='Голосовое сообщение';renderMessages();renderList()};document.getElementById('photoBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{if(!e.target.files[0])return;active.messages.push(['me','Фото','сейчас','photo']);active.preview='Отправлено фото';renderMessages();renderList()};document.getElementById('back').onclick=()=>{document.getElementById('sidebar').classList.remove('mobile-hidden');document.getElementById('main').classList.remove('mobile-main')};
    document.getElementById('createAccount').onclick=async()=>{const n=document.getElementById('accountName').value.trim(),code=document.getElementById('telegramCode').value.trim(),telegram_id=Number(document.getElementById('telegramId').value.trim()),hint=document.getElementById('codeHint'),btn=document.getElementById('createAccount');if(!n||!telegram_id){hint.textContent='Заполни имя и Telegram ID';hint.style.color='#e36d79';return}if(!/^\d{6}$/.test(code)){hint.textContent='Введи 6‑значный код из Telegram';hint.style.color='#e36d79';return}btn.disabled=true;btn.textContent='Проверяем…';try{const res=await fetch('http://localhost:8000/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,code,telegram_id})});if(!res.ok){const e=await res.json();throw new Error(e.detail||'Ошибка проверки')}localStorage.setItem('seva-account',n);localStorage.setItem('seva-telegram-verified','1');document.getElementById('welcome').remove()}catch(e){hint.textContent=e.message+' · проверь данные и попробуй снова';hint.style.color='#e36d79';btn.disabled=false;btn.textContent='Подтвердить и войти'}};if(localStorage.getItem('seva-account')&&localStorage.getItem('seva-telegram-verified'))document.getElementById('welcome').remove();
    chats.forEach((c,i)=>c.username=c.username||['@alina_m','@max_orlov','@lera_k','@seva_team','@ilya_s'][i]);
    renderList=function(filter=''){const q=filter.toLowerCase().replace(/^@/,'');list.innerHTML=chats.filter(c=>c.name.toLowerCase().includes(q)||c.username.toLowerCase().includes(q)).map(c=>`<div class="chat ${c.id===active.id?'selected':''}" data-id="${c.id}"><div class="avatar ${c.av}">${c.initial}</div><div class="chat-body"><div class="chat-row"><span class="chat-name">${c.name}</span><span class="time">${c.time}</span></div><div class="chat-row"><span class="preview">${c.username} · ${c.preview}</span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div></div></div>`).join('');document.querySelectorAll('.chat').forEach(el=>el.onclick=()=>selectChat(+el.dataset.id));};
    document.getElementById('createAccount').onclick=async()=>{const btn=document.getElementById('createAccount'),hint=document.getElementById('codeHint');btn.disabled=true;btn.textContent='Открываем Telegram…';try{const start=await fetch('http://localhost:8000/api/auth/start',{method:'POST'}).then(r=>r.json());window.open(start.bot_url,'_blank');hint.textContent='Нажми Start в боте, затем подожди…';let tries=0;const timer=setInterval(async()=>{tries++;try{const data=await fetch('http://localhost:8000/api/auth/poll/'+start.state).then(r=>r.json());if(data.verified){clearInterval(timer);localStorage.setItem('seva-account',data.name);localStorage.setItem('seva-username',data.username);localStorage.setItem('seva-telegram-verified','1');document.getElementById('welcome').remove()}}catch(e){}if(tries>60){clearInterval(timer);hint.textContent='Ссылка истекла. Нажми кнопку ещё раз';btn.disabled=false;btn.textContent='Войти через Telegram'}},3000)}catch(e){hint.textContent='Не удалось связаться с сервером';btn.disabled=false;btn.textContent='Войти через Telegram'}};
    // Новый аккаунт начинается без чатов
    chats.length=0; active=null;
    renderList=function(){list.innerHTML='<div class="empty-state"><div><div class="empty-icon">✦</div><h2>Пока нет чатов</h2><p>Найди друга по имени или username, чтобы начать общение.</p><button onclick="document.getElementById(\'newChat\').click()">Добавить друга</button></div></div>';};
    renderMessages=function(){document.getElementById('messages').innerHTML='<div class="empty-state"><div><div class="empty-icon">💬</div><h2>Начни общение</h2><p>Здесь появятся твои сообщения и новые знакомства.</p></div></div>';};
    document.getElementById('newChat').onclick=()=>{const username=prompt('Введи username друга (например, @seva_friend):');if(!username)return;const clean=username.replace(/^@/,'').toLowerCase();if(!/^[a-z][a-z0-9_]{4,31}$/.test(clean)){alert('Username должен содержать латинские буквы, цифры и _ (от 5 символов)');return}const c={id:Date.now(),name:clean,username:'@'+clean,initial:clean[0].toUpperCase(),av:'av-blue',status:'новый контакт',preview:'Новый чат',time:'сейчас',messages:[]};chats.push(c);selectChat(c.id);};
    document.getElementById('settingsBtn').onclick=()=>{const old=document.querySelector('.profile-modal');if(old)old.remove();const name=localStorage.getItem('seva-account')||'';const modal=document.createElement('div');modal.className='profile-modal';modal.innerHTML=`<div class="profile-card"><button class="close">×</button><h2>Настройки профиля</h2><label class="avatar-edit" title="Изменить аватар">${localStorage.getItem('seva-avatar')?`<img src="${localStorage.getItem('seva-avatar')}">`:'＋'}</label><input type="file" id="avatarFile" accept="image/*" hidden><input id="profileName" value="${name}" placeholder="Имя"><input id="profileUsername" value="${localStorage.getItem('seva-username')||''}" placeholder="Username без @"><button class="save">Сохранить изменения</button></div>`;document.body.appendChild(modal);modal.querySelector('.close').onclick=()=>modal.remove();modal.querySelector('.avatar-edit').onclick=()=>modal.querySelector('#avatarFile').click();modal.querySelector('#avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{localStorage.setItem('seva-avatar',r.result);modal.querySelector('.avatar-edit').innerHTML=`<img src="${r.result}">`;document.getElementById('headAvatar').innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`};r.readAsDataURL(f)};modal.querySelector('.save').onclick=()=>{const n=modal.querySelector('#profileName').value.trim(),u=modal.querySelector('#profileUsername').value.trim().replace(/^@/,'');if(!n||!/^[a-z][a-z0-9_]{4,31}$/i.test(u)){alert('Укажи имя и корректный username (латиница, от 5 символов)');return}localStorage.setItem('seva-account',n);localStorage.setItem('seva-username',u);modal.remove()}};
    renderList();renderMessages();
  </script>
</body>
</html>
